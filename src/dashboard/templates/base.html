<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Dashboard</title>
    <script>
    (function(){var t=localStorage.getItem('dashboard-theme');if(t==='light'){document.documentElement.setAttribute('data-theme','light')}})();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="/static/base.css?v=6">
    <link rel="stylesheet" href="/static/status.css?v=6">
    <link rel="stylesheet" href="/static/scan.css?v=6">
    <link rel="stylesheet" href="/static/datos.css?v=6">
    <link rel="stylesheet" href="/static/responsive.css?v=6">
</head>
<body>
    <div class="dashboard-shell">
        <header class="dashboard-header">
            <div class="header-left">
                <svg class="logo" viewBox="0 0 460 105" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Job Dashboard">
                    <style>
                        .logo-shadow { fill: var(--logo-shadow); }
                        .logo-job    { fill: var(--logo-job); }
                        .logo-dash   { fill: var(--logo-dashboard); }
                    </style>
                    <g class="logo-shadow" transform="translate(3, 4)">
                        <text x="0" y="60" font-family="'Press Start 2P', monospace" font-size="56">JOB</text>
                        <text x="0" y="88" font-family="'Press Start 2P', monospace" font-size="28">DASHBOARD</text>
                    </g>
                    <text class="logo-job" x="0" y="60" font-family="'Press Start 2P', monospace" font-size="56" shape-rendering="crispEdges">JOB</text>
                    <text class="logo-dash" x="0" y="88" font-family="'Press Start 2P', monospace" font-size="28" shape-rendering="crispEdges">DASHBOARD</text>
                </svg>
            </div>
            <div class="header-right">
            </div>
        </header>
        <nav class="tab-bar" hx-boost="false">
            <button class="tab tab-active"
                    hx-get="/status/panel"
                    hx-target="#main-content"
                    hx-trigger="click"
                    hx-swap="innerHTML"
                    data-tab="status"
                    autofocus>STATUS</button>
            <button class="tab"
                    hx-get="/scan/config"
                    hx-target="#main-content"
                    hx-trigger="click"
                    hx-swap="innerHTML"
                    data-tab="scan">SCAN</button>
            <button class="tab"
                    hx-get="/datos/panel"
                    hx-target="#main-content"
                    hx-trigger="click"
                    hx-swap="innerHTML"
                    data-tab="datos">DATA</button>
            <button class="tab"
                    hx-get="/settings"
                    hx-target="#main-content"
                    hx-trigger="click"
                    hx-swap="innerHTML"
                    data-tab="settings">SETTINGS</button>
        </nav>
        <main id="main-content">
            {% block content %}{% endblock %}
        </main>
        <footer class="dashboard-footer">
            <span class="footer-stat">{{ total_jobs }} jobs</span>
            <span class="footer-version">Job Dashboard release v1.0 — 2026-07-25</span>
            <span class="footer-credit">Created by Rodrigo Daniel Bedani</span>
        </footer>
    </div>
    <script src="/static/script.js?v=5"></script>
</body>
</html>
