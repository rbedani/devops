<div class="platforms-list">
  {% for platform in platforms %}
    <div class="platform-item{% if not platform.enabled %} platform-disabled{% endif %}" id="platform-{{ platform.id }}">
      <span class="platform-status-dot{% if platform.enabled %} enabled{% else %} disabled{% endif %}"></span>
      <span class="platform-item-name">{{ platform.name }}</span>
      {% if not platform.enabled %}<span class="platform-disabled-badge">DISABLED</span>{% endif %}
      <span class="platform-item-url">{{ platform.url }}</span>
      <button class="btn btn-platform-toggle"
              hx-post="/datos/platforms/toggle/{{ platform.id }}"
              hx-target=".platforms-container"
              hx-swap="innerHTML"
              title="{% if platform.enabled %}Disable{% else %}Enable{% endif %} {{ platform.name }}">
        {% if platform.enabled %}DISABLE{% else %}ENABLE{% endif %}
      </button>
    </div>
  {% endfor %}
</div>
