<div class="filter-dropdown" id="filter-menu">
    {% for filter in filters %}
    <label class="filter-option">
        <input type="checkbox"
               class="filter-checkbox"
               data-filter-key="{{ filter.key }}"
               {% if filter.key in active_filters %}checked{% endif %}>
        {{ filter.label }}
    </label>
    {% endfor %}
</div>
