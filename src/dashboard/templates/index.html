{% extends "base.html" %}
{% block content %}
<div class="header-menu">
    <div class="menu-row">
        <input type="text" id="search-input" class="search-box" placeholder="Search title / company..."
               name="search"
               hx-get="/table" hx-trigger="keyup changed delay:2000ms" hx-target="#table-container"
               hx-include="[name='per_page'], [name='since'], #filter-state"
               hx-push-url="true">

        <select name="since" class="date-filter">
            <option value="" selected>Any date</option>
            <option value="24h">Last 24h</option>
            <option value="7d">Last week</option>
            <option value="30d">Last month</option>
        </select>

        <div class="filter-wrapper" id="filter-wrapper">
            <button class="btn btn-filter" id="filter-btn" type="button">FILTER ▾</button>
            <div class="filter-dropdown" id="filter-menu" style="display:none;">
                {% for filter in filters %}
                <label class="filter-option">
                    <input type="checkbox" class="filter-checkbox" data-filter-key="{{ filter.key }}">
                    {{ filter.label }}
                </label>
                {% endfor %}
            </div>
        </div>

        <button class="btn btn-refresh" id="refresh-btn"
                hx-get="/table"
                hx-include="[name='search'], [name='since'], [name='per_page'], #filter-state"
                hx-target="#table-container" hx-swap="innerHTML"
                title="Refresh table with current filters">
            ↻ REFRESH
        </button>

        <!-- Hidden field to carry active filter state for HTMX includes -->
        <input type="hidden" id="filter-state" name="filters" value="">
    </div>
</div>

<div id="table-container"
     hx-get="/table"
     hx-trigger="load"
     hx-include="[name='since']"
     hx-swap="innerHTML"></div>
{% endblock %}
